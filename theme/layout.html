<!doctype html>
<html lang="{{lang}}" data-base="{{base}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="color-scheme" content="light dark">
  <meta property="og:title" content="{{ogTitle}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <link rel="canonical" href="{{canonical}}">
  <link rel="alternate" type="application/rss+xml" title="{{siteTitle}}" href="{{base}}/feed.xml">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23ffd21f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{base}}/assets/style.css">
  {{math}}
  <script>
    // Runs before first paint so a saved theme never flashes the wrong colors
    try {
      const theme = localStorage.getItem('theme');
      if (theme) document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
  <script src="{{base}}/assets/site.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{base}}/">{{siteTitle}}</a>
    <nav>
{{nav}}
    </nav>
    <div class="search" role="search">
      <input id="search-input" type="search" placeholder="Search" aria-label="Search this site" autocomplete="off">
      <ul id="search-results" hidden></ul>
    </div>
    <button id="theme-toggle" type="button" aria-label="Toggle dark mode">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/>
      </svg>
    </button>
  </header>
  <main>
{{content}}
  </main>
  <footer class="site-footer">
    <a href="{{base}}/feed.xml">rss</a>
  </footer>
</body>
</html>
