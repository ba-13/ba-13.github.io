name: Keep Supabase awake

# Free Supabase projects pause after a quiet week, so read the database twice a week.
# A failed run means the project is paused or unreachable, and GitHub emails you.
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read vote total
        run: |
          url=$(jq -r '.supabase.url // ""' site.json)
          key=$(jq -r '.supabase.key // ""' site.json)
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "Supabase isn't configured yet"
            exit 0
          fi
          curl --silent --show-error --fail-with-body --request POST \
            "$url/rest/v1/rpc/vote_count" \
            --header "apikey: $key" \
            --header "Content-Type: application/json" \
            --data '{"slug":"keepalive"}'
